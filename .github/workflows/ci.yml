name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend · H5 / WeChat / Admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Retain actual checkout identity
        run: python -B scripts/ci_context.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Install exact workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Client ownership, types and three builds
        run: python -B scripts/check.py frontend
      - name: Retain frontend check coordinate on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: frontend-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci/checkout.json
          retention-days: 30
          if-no-files-found: warn
  docs:
    name: Document integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Retain actual checkout identity
        run: python -B scripts/ci_context.py
      - name: Check acceptance collector syntax
        run: python -m compileall -q scripts
      - run: python -B scripts/check.py hygiene
      - run: python -B scripts/check.py docs
      - name: Retain document check coordinate on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: docs-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci/checkout.json
          retention-days: 30
          if-no-files-found: warn
  backend:
    name: Backend · MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ROOT_PASSWORD: qixu-ci-root-only
          MYSQL_DATABASE: qixu_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pqixu-ci-root-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Retain actual checkout identity
        run: python -B scripts/ci_context.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Install locked offline proof verifier and test real public signatures
        run: |
          npm ci --prefix randomness --ignore-scripts --no-audit --no-fund
      - name: Provision schema-scoped ephemeral test identity
        env:
          MYSQL_PWD: qixu-ci-root-only
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -u root <<'SQL'
          CREATE USER 'qixu_ci_app'@'%' IDENTIFIED BY 'qixu-ci-app-only';
          GRANT SELECT,INSERT,UPDATE,DELETE,CREATE,ALTER,INDEX,REFERENCES ON qixu_ci.* TO 'qixu_ci_app'@'%';
          SQL
      - name: Build and real MySQL HTTP acceptance
        env:
          QIXU_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/qixu_ci?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
          QIXU_TEST_DB_USER: qixu_ci_app
          QIXU_TEST_DB_PASSWORD: qixu-ci-app-only
        run: python -B scripts/check.py backend
      - name: Fresh production bytecode and static finding change gate
        run: python -B scripts/check.py static
      - name: Complete current Maven and both npm lockfile advisory change gates
        run: python -B scripts/check.py dependencies
      - name: Retain actual test reports on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: backend-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/ci/checkout.json
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
            backend/target/failsafe-reports/*.xml
            backend/target/failsafe-reports/*.txt
            backend/target/site/jacoco/**
            backend/target/static-analysis/spotbugsXml.xml
            test-results/governance/**
          retention-days: 30
          if-no-files-found: warn
